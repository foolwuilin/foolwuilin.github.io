# Sveltia CMS configuration (Decap-compatible).
# Auth: GitHub OAuth via a free Cloudflare Worker — set base_url to your worker URL.
backend:
  name: github
  repo: foolwuilin/foolwuilin.github.io
  branch: main
  base_url: https://sveltia-cms-auth.iichizero.workers.dev

site_url: https://foolwuilin.github.io
display_url: https://foolwuilin.github.io
publish_mode: simple

# Cloudinary as the media library (cloud: nkbzi14a)
media_library:
  name: cloudinary
  config:
    cloud_name: nkbzi14a
    api_key: "225224594181799"
    default_transformations:
      - - fetch_format: auto
          quality: auto

collections:
  - name: scratch-the-world
    label: "Scratch the World (travel diary)"
    folder: src/content/scratch-the-world
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: "Summary (answer-first line)", widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: location, label: "Location (e.g. Times Square, NYC)", widget: string }
      - { name: country, label: Country, widget: string, required: false }
      - { name: lat, label: Latitude, widget: number, required: false, value_type: float }
      - { name: lng, label: Longitude, widget: number, required: false, value_type: float }
      - { name: coverImage, label: Cover image, widget: image, media_library: { name: cloudinary } }
      - { name: coverAlt, label: "Cover alt text (required for SEO/AI)", widget: string }
      - { name: youtube, label: "YouTube video ID", widget: string, required: false }
      - { name: instagram, label: "Instagram post/reel URL", widget: string, required: false }
      - { name: gear, label: Gear used, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: featured, label: "Featured?", widget: boolean, default: false }
      - { name: draft, label: "Unpublish (hide from website)?", widget: boolean, default: false, hint: "Turn ON to remove this post from the live site. It stays saved — turn OFF to publish it again." }
      - { name: body, label: Story, widget: markdown }

  - name: tutorials
    label: "Scratch Tutorials"
    folder: src/content/tutorials
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: "Summary (answer-first line)", widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: level, label: Level, widget: select, options: [beginner, intermediate, advanced] }
      - { name: order, label: Order, widget: number, default: 0, value_type: int }
      - { name: coverImage, label: Cover image, widget: image, media_library: { name: cloudinary } }
      - { name: coverAlt, label: "Cover alt text", widget: string }
      - { name: youtube, label: "YouTube video ID", widget: string, required: false }
      - { name: instagram, label: "Instagram post/reel URL", widget: string, required: false }
      - { name: steps, label: "How-to steps (for HowTo schema)", widget: list, required: false, field: { name: step, label: Step, widget: string } }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: featured, label: "Featured?", widget: boolean, default: false }
      - { name: draft, label: "Unpublish (hide from website)?", widget: boolean, default: false, hint: "Turn ON to remove this post from the live site. It stays saved — turn OFF to publish it again." }
      - { name: body, label: Lesson, widget: markdown }

  - name: gear
    label: "Portablism & Gear"
    folder: src/content/gear
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: date, label: Date, widget: datetime }
      - { name: order, label: Order, widget: number, default: 0, value_type: int }
      - { name: coverImage, label: Cover image, widget: image, media_library: { name: cloudinary } }
      - { name: coverAlt, label: "Cover alt text", widget: string }
      - { name: instagram, label: "Instagram post/reel URL", widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: draft, label: "Unpublish (hide from website)?", widget: boolean, default: false, hint: "Turn ON to remove this post from the live site. It stays saved — turn OFF to publish it again." }
      - { name: body, label: Body, widget: markdown }

  - name: qa
    label: "Q&A"
    folder: src/content/qa
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: yaml
    format: yaml
    identifier_field: question
    fields:
      - { name: question, label: Question, widget: string }
      - { name: answer, label: Answer, widget: text }
      - { name: category, label: Category, widget: string, default: General }
      - { name: order, label: Order, widget: number, default: 0, value_type: int }

  - name: zh
    label: "中文文章 (Traditional Chinese)"
    folder: src/content/zh
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: 標題 Title, widget: string }
      - { name: summary, label: "摘要 Summary (answer-first)", widget: text }
      - { name: date, label: 日期 Date, widget: datetime }
      - { name: section, label: 對應英文分類 Section, widget: select, options: [scratch-the-world, tutorials, gear] }
      - { name: enSlug, label: "對應英文文章 slug (enSlug)", widget: string }
      - { name: location, label: 地點 Location, widget: string, required: false }
      - { name: coverImage, label: 封面圖 Cover image, widget: image, media_library: { name: cloudinary } }
      - { name: coverAlt, label: 圖片替代文字 Alt text, widget: string }
      - { name: youtube, label: "YouTube 影片 ID", widget: string, required: false }
      - { name: instagram, label: "Instagram 貼文/Reel 連結", widget: string, required: false }
      - { name: tags, label: 標籤 Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: draft, label: "取消發佈（從網站隱藏）？", widget: boolean, default: false, hint: "打開以將這篇從網站上移除；內容會保留，關閉即可重新發佈。" }
      - { name: body, label: 內文 Body, widget: markdown }

question: "Who is DJ FOOL Wuilin?"
answer: "DJ FOOL Wuilin (real name Yilin Wu / 吳奕霖) is a Taipei-based turntablist and portablist who has been DJing since 2012. He trained at Scratch DJ Academy in New York and LA and Dubspot LA, and is known for scratching with portable turntables in cities around the world."

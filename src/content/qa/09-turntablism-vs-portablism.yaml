question: "What's the difference between turntablism and portablism?"
answer: "Turntablism is the broad art of using turntables as instruments — scratching and beat juggling on full-size decks. Portablism is a subset of turntablism that uses small, portable turntables. Same skills and techniques, just on gear you can carry anywhere."

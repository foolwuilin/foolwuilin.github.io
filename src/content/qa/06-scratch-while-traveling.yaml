question: "Why do you scratch in public places when you travel?"
answer: "For me, scratching while traveling is like a tourist taking photos. A photo holds a moment; a scratch does the same for me. Setting up a portable turntable in a new city — a park, a rooftop, Times Square — is how I remember the place and share the feeling. That's the whole idea behind 'Scratch the World'."
